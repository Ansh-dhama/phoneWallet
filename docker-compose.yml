version: "3.8"

services:

  postgres:
    image: postgres:16
    container_name: phonewallet-postgres
    environment:
      POSTGRES_DB: phone_wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - phonewallet-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: phonewallet-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: phonewallet-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: phonewallet-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  phonewallet-app:
    build: .
    container_name: phonewallet-app
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8090:8090"

volumes:
  phonewallet-postgres-data: