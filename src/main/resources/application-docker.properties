server.port=8090
spring.datasource.url=jdbc:mysql://mysql:3306/phoneWallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.kafka.bootstrap-servers=kafka:29092

jwt.secretKey=${JWT_SECRET_KEY}
wallet.topup.webhook-secret=${TOPUP_WEBHOOK_SECRET}
wallet.topup.demo-enabled=${WALLET_TOPUP_DEMO_ENABLED:false}
wallet.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8090}

wallet.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
wallet.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
wallet.bootstrap.admin.mobile=${BOOTSTRAP_ADMIN_MOBILE:}
