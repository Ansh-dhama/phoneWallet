spring.application.name=phoneWallet
server.port=${PORT:8090}

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Let Hibernate detect MySQL dialect automatically.
# Do NOT add spring.jpa.database-platform unless required.

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}


# =========================================================
# KAFKA
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

spring.kafka.consumer.group-id=wallet-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.listener.ack-mode=record

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# =========================================================
# REDIS
# =========================================================

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

spring.data.redis.repositories.enabled=false


# =========================================================
# JWT
# =========================================================

jwt.secretKey=${JWT_SECRET_KEY}

jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:10}


# =========================================================
# WALLET / TRANSACTION LIMITS
# =========================================================

wallet.transaction.max-amount=${WALLET_TRANSACTION_MAX_AMOUNT:50000}

wallet.topup.max-amount=${WALLET_TOPUP_MAX_AMOUNT:50000}


# =========================================================
# TOP-UP SECURITY
# =========================================================

wallet.topup.webhook-secret=${WALLET_TOPUP_WEBHOOK_SECRET}

# NEVER enable demo top-up on production.
wallet.topup.demo-enabled=${WALLET_TOPUP_DEMO_ENABLED:false}


# =========================================================
# KAFKA / OUTBOX
# =========================================================

wallet.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}

wallet.outbox.poll-ms=${OUTBOX_POLL_MS:1000}

wallet.outbox.recovery-ms=${OUTBOX_RECOVERY_MS:30000}


# =========================================================
# LEDGER RECONCILIATION
# =========================================================

wallet.ledger.audit-cron=${LEDGER_AUDIT_CRON:0 0 2 * * *}


# =========================================================
# PROXY / CORS
# =========================================================

security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8090}


# =========================================================
# SWAGGER / OPENAPI
# =========================================================

springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


# =========================================================
# ACTUATOR / MONITORING
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.probes.enabled=true

management.endpoint.health.show-details=when_authorized

management.health.redis.enabled=true

management.metrics.tags.application=${spring.application.name}


# =========================================================
# ERROR HANDLING
# =========================================================

server.error.include-message=never
server.error.include-stacktrace=never