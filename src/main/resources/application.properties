spring.application.name=phoneWallet
spring.profiles.default=local
server.port=${PORT:8090}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/phoneWallet?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YourNewStrongPassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Kafka reliability. Local can keep replication factor 1; production should use 3.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.consumer.group-id=wallet-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Portable Redis defaults. Money paths fail closed if Redis becomes unavailable.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

jwt.secretKey=${JWT_SECRET_KEY:LOCAL_ONLY_PhoneWallet_JWT_Secret_Change_Before_Production_2026}
wallet.topup.webhook-secret=${TOPUP_WEBHOOK_SECRET:LOCAL_ONLY_TopUp_Webhook_Secret_Change_Before_Production_2026}
jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:10}
wallet.topup.max-amount=${WALLET_TOPUP_MAX_AMOUNT:50000}
wallet.transaction.max-amount=${WALLET_TRANSACTION_MAX_AMOUNT:50000}
wallet.topup.demo-enabled=false
wallet.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}
wallet.outbox.poll-ms=1000
wallet.outbox.recovery-ms=30000
wallet.ledger.audit-cron=${LEDGER_AUDIT_CRON:0 0 2 * * *}

security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8090}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.redis.enabled=true
management.metrics.tags.application=${spring.application.name}

server.error.include-message=never
server.error.include-stacktrace=never
