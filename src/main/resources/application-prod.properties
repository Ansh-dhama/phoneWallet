# Production intentionally has no secret fallbacks.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secretKey=${JWT_SECRET_KEY}
wallet.topup.webhook-secret=${TOPUP_WEBHOOK_SECRET}
wallet.topup.demo-enabled=false
wallet.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:3}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}

wallet.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
wallet.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
wallet.bootstrap.admin.mobile=${BOOTSTRAP_ADMIN_MOBILE:}
