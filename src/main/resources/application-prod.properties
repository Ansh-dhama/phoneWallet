# =========================================================
# PRODUCTION PROFILE
# =========================================================

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# Production proxy
security.trust-forwarded-headers=true

server.forward-headers-strategy=framework


# Never permit demo settlement in production
wallet.topup.demo-enabled=false


# Production Kafka should eventually use 3 brokers.
wallet.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}


# Never expose internals
server.error.include-message=never
server.error.include-stacktrace=never


# Swagger can later be disabled for production if desired
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

# ============================
# AIVEN KAFKA
# ============================

spring.kafka.properties.security.protocol=SASL_SSL

spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256

spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
